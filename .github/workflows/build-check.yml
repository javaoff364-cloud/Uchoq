name: Uchoq Build Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Restore release keystore
        env:
          UCHOQ_KEYSTORE_BASE64: ${{ secrets.UCHOQ_KEYSTORE_BASE64 }}
        run: |
          test -n "$UCHOQ_KEYSTORE_BASE64" || {
            echo "::error::UCHOQ_KEYSTORE_BASE64 is not configured."
            exit 1
          }
          echo "$UCHOQ_KEYSTORE_BASE64" | base64 --decode > TMessagesProj/config/release.keystore

      - name: Build Uchoq release APK
        run: ./gradlew assembleAfatRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: uchoq-apk
          path: TMessagesProj_App/build/outputs/apk/afat/release/app.apk
          if-no-files-found: error
