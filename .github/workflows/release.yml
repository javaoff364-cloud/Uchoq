name: Uchoq Release

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK components
        run: |
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Restore release keystore
        env:
          UCHOQ_KEYSTORE_BASE64: ${{ secrets.UCHOQ_KEYSTORE_BASE64 }}
        run: |
          mkdir -p TMessagesProj/config
          if [ -n "$UCHOQ_KEYSTORE_BASE64" ]; then
            echo "$UCHOQ_KEYSTORE_BASE64" | base64 --decode > TMessagesProj/config/release.keystore
          else
            echo "No release secret found; using deterministic CI keystore for this release build."
            keytool -genkeypair -v -keystore TMessagesProj/config/release.keystore -storepass android -keypass android -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Uchoq, O=Uchoq, C=UZ"
          fi
      - name: Build Uchoq release APK
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease --build-cache --no-daemon --stacktrace
      - name: Find APK
        id: apk
        run: |
          APK="$(find TMessagesProj_App/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK" || { echo "::error::APK not found"; exit 1; }
          echo "path=$APK" >> "$GITHUB_OUTPUT"
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="${{ steps.apk.outputs.path }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.1.0"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Uchoq $TAG" --generate-notes
          fi
          echo "Published $TAG"
