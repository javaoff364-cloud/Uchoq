name: Uchoq Android Build
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Signing key
        run: |
          mkdir -p TMessagesProj/config
          keytool -genkeypair -v -keystore TMessagesProj/config/release.keystore -storepass android -keypass android -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Uchoq, O=Uchoq, L=Tashkent, C=UZ"
      - run: chmod +x gradlew
      - name: Build Uchoq ARM64 Release
        run: ./gradlew :TMessagesProj_AppStandalone:assembleAArm64Standalone --build-cache --no-daemon --stacktrace
      - name: List APK
        run: find TMessagesProj_AppStandalone/build/outputs/apk -type f -name "*.apk" -print
      - uses: actions/upload-artifact@v4
        with:
          name: uchoq-arm64-release
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
          if-no-files-found: error