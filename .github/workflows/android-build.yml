name: Uchoq Android Build
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK components
        run: |
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Signing key
        run: |
          mkdir -p TMessagesProj/config
          if [ ! -f TMessagesProj/config/release.keystore ]; then
            keytool -genkeypair -v -keystore TMessagesProj/config/release.keystore -storepass android -keypass android -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Uchoq, O=Uchoq, L=Tashkent, C=UZ"
          else
            echo "Using existing Uchoq release keystore"
            keytool -list -keystore TMessagesProj/config/release.keystore -storepass android >/dev/null
          fi
      - name: Restore native build cache
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj_AppStandalone/.cxx
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-uchoq-native-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/CMakeLists.txt', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-uchoq-native-

      - run: chmod +x gradlew
      - name: Build Uchoq ARM64 Release
        run: ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --build-cache --no-daemon --stacktrace
      - name: Save native build cache
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj_AppStandalone/.cxx
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: List APK
        run: find TMessagesProj_AppStandalone/build/outputs/apk -type f -name "*.apk" -print
      - uses: actions/upload-artifact@v4
        with:
          name: uchoq-arm64-release
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
          if-no-files-found: error
